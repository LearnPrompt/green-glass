<style>
  :root {
    --h: 161;
    --bg: #000000; --rail: #050807; --panel: #0a0e0c; --card: #101613; --active: #1b211e;
    --line: rgba(255,255,255,.06); --line-2: rgba(255,255,255,.07); --line-3: rgba(255,255,255,.045);
    --fg: #e8efeb; --fg-strong: #f4f8f6;
    --fg-2: rgba(232,239,235,.62); --fg-3: rgba(232,239,235,.45); --fg-4: rgba(232,239,235,.34);
    --green: hsl(var(--h), 90%, 41%); --green-hi: hsl(var(--h), 90%, 45%);
    --green-text: hsl(var(--h), 80%, 62%); --green-deep: hsl(var(--h), 90%, 11%);
    --green-deep-hover: hsl(var(--h), 90%, 15%);
    --amber: #ffb457; --orange: #ff8f6b; --red: #ff7d6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif; font-size: 14px; overflow: hidden; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-feature-settings: 'tnum' 1; }
  .cap  { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; }
  .app { display: flex; height: 100vh; }

  .rail { width: 232px; flex-shrink: 0; display: flex; flex-direction: column; padding: 22px 14px; background: var(--rail); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 9px; padding: 4px 10px 22px; }
  .brand b { font-size: 17px; font-weight: 700; letter-spacing: .02em; color: var(--fg-strong); }
  .brand span { font-size: 12.5px; font-weight: 500; color: var(--fg-2); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: var(--fg-2); font-size: 13.5px; text-decoration: none; cursor: pointer; border: 1px solid transparent; }
  .nav a:hover { background: rgba(255,255,255,.045); color: var(--fg); }
  .nav a.on { background: var(--active); border-color: var(--line-2); color: var(--fg-strong); font-weight: 600; }
  .nav a svg { width: 16px; height: 16px; stroke: rgba(232,239,235,.42); flex-shrink: 0; }
  .nav a .cnt { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--fg-4); }
  .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--green-hi); box-shadow: 0 0 12px hsla(var(--h),90%,45%,.55), 0 0 0 3px hsla(var(--h),90%,45%,.14); }
  .dot-wrap { width: 16px; display: flex; justify-content: center; flex-shrink: 0; }
  .quota { margin-top: auto; padding: 15px; border-radius: 14px; background: #0c110f; border: 1px solid var(--line); }
  .quota .num { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; }
  .quota .num b { font-size: 24px; font-weight: 500; color: var(--fg-strong); }
  .bar { margin-top: 11px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--green); }

  .main { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 24px; min-width: 0; overflow: auto; }
  .top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.015em; color: var(--fg-strong); }
  .top .sub { font-size: 11.5px; color: var(--fg-3); margin-top: 5px; }
  .search { display: flex; align-items: center; gap: 9px; width: 300px; margin-left: 46px; padding: 10px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line-2); }
  .search input { flex: 1; background: none; border: none; outline: none; color: var(--fg); font: inherit; font-size: 12.5px; }
  .search input::placeholder { color: rgba(232,239,235,.4); }
  .search:focus-within { border-color: hsla(var(--h),90%,41%,.34); box-shadow: 0 0 0 3px hsla(var(--h),90%,41%,.1); }
  .cta { display: flex; align-items: center; gap: 8px; margin-left: auto; padding: 10px 18px; border-radius: 999px; background: var(--green-deep); border: 1px solid hsla(var(--h),90%,41%,.34); color: #f2fbf6; font-size: 13px; font-weight: 600; cursor: pointer; }
  .cta:hover { background: var(--green-deep-hover); border-color: hsla(var(--h),90%,41%,.5); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
  .fcard { position: relative; overflow: hidden; height: 146px; border-radius: 16px; background: #080b0a; border: 1px solid var(--line-2); }
  .fluid { position: absolute; inset: -18%; filter: blur(30px); opacity: .82; }
  .fluid i { position: absolute; border-radius: 50%; animation: drift 22s ease-in-out infinite alternate; }
  .fluid i:nth-child(2) { animation-duration: 27s; animation-delay: -6s; }
  .fluid i:nth-child(3) { animation-duration: 19s; animation-delay: -12s; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(9%,-11%,0) scale(1.22); } }
  .fcard .shade { position: absolute; inset: 0; background: linear-gradient(168deg, rgba(0,0,0,.18), rgba(0,0,0,.52)); }
  .fcard .sheen { position: absolute; inset: 0; background: linear-gradient(158deg, rgba(255,255,255,.08), rgba(255,255,255,0) 44%); }
  .fcard .body { position: relative; height: 100%; display: flex; flex-direction: column; padding: 15px 17px; }
  .fcard .cap { color: rgba(255,255,255,.72); }
  .fcard .name { font-size: 14.5px; font-weight: 700; color: #fff; margin-top: 7px; }
  .fcard .val { display: flex; align-items: baseline; gap: 7px; margin-top: auto; }
  .fcard .val b { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 400; letter-spacing: -.02em; color: #fff; font-feature-settings: 'tnum' 1; }
  .fcard .val span { font-size: 11.5px; color: rgba(255,255,255,.72); }
  .fcard .note { display: flex; gap: 6px; margin-top: 8px; font-size: 10.5px; color: rgba(255,255,255,.6); }
  .fcard .note b { font-weight: 600; }
  .tone-up { color: var(--green-text); } .tone-warn { color: var(--amber); } .tone-risk { color: var(--orange); }

  .grid { flex: 1; display: grid; grid-template-columns: 262px minmax(0,1fr) 316px; gap: 14px; min-height: 480px; }
  .panel { border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .panel .hd { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 0; }
  .panel .hd b { font-size: 15px; font-weight: 700; color: var(--fg-strong); }
  .panel .hd .mono { font-size: 10px; color: rgba(232,239,235,.32); }

  .qgroup { display: flex; align-items: center; gap: 8px; padding: 14px 16px 9px; font-size: 12px; color: var(--fg-2); }
  .qgroup .mono { font-size: 11px; color: rgba(232,239,235,.4); }
  .qdot { width: 6px; height: 6px; border-radius: 99px; flex-shrink: 0; }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line-3); font-size: 12.5px; color: #e2ebe6; cursor: pointer; }
  .qrow:hover { background: rgba(255,255,255,.03); }
  .qrow .mono { font-size: 9.5px; color: var(--fg-4); }
  .qrow.done .txt { color: var(--fg-4); text-decoration: line-through; }
  .cb { width: 17px; height: 17px; border-radius: 6px; border: 1.4px solid rgba(150,255,210,.2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .qrow.done .cb { background: var(--green); border-color: var(--green); }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; padding: 2.5px 6px; border-radius: 5px; margin-left: auto; white-space: nowrap; flex-shrink: 0; }
  .qrow .txt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .qrow > span:first-child + span:not(.txt) { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .qpanel .qrow .t, .qpanel .qrow > .mono[style] { display: none; }
  .qrow > .mono { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .badge.todo { background: hsla(var(--h),90%,41%,.13); color: var(--green-text); }
  .badge.run  { background: rgba(255,180,87,.14); color: var(--amber); }
  .days { margin-left: auto; }

  .stage-wrap { background: #070a09; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 13px 15px; flex-wrap: wrap; }
  .tb { font-size: 11.5px; padding: 6px 12px; border-radius: 999px; background: #0d1210; border: 1px solid var(--line); color: rgba(232,239,235,.55); cursor: pointer; }
  .tb.on { display: flex; align-items: center; gap: 6px; background: #171f1b; border-color: transparent; color: #eafaf2; }
  .tb.on::before { content: ""; width: 5px; height: 5px; border-radius: 99px; background: var(--green-hi); }
  .stage { position: relative; flex: 1; min-height: 300px; }
  .stage .glowbg { position: absolute; inset: 0; background: radial-gradient(58% 46% at 50% 56%, hsla(var(--h),90%,41%,.09), transparent 70%); }
  .prog { position: absolute; left: 22px; top: 16px; width: 128px; padding: 14px; border-radius: 13px; transform: rotate(-7deg); background: linear-gradient(158deg, rgba(255,255,255,.13), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .prog .t { font-size: 10.5px; color: rgba(255,255,255,.72); }
  .prog .v { font-family: 'JetBrains Mono', monospace; font-size: 27px; font-weight: 500; color: #fff; margin-top: 5px; letter-spacing: -.02em; }
  .prog .s { font-size: 9.5px; color: rgba(255,255,255,.5); margin-top: 3px; }
  .prog .bar { margin-top: 10px; background: rgba(255,255,255,.16); }

  .ring { position: absolute; inset: 0; perspective: 1100px; }
  .rcard { position: absolute; left: 50%; top: 50%; cursor: pointer; border-radius: 13px;
    background: linear-gradient(160deg, #f2f6f3, #d3dbd6); box-shadow: 0 18px 34px -18px rgba(0,0,0,.9);
    padding: 13px 14px; display: flex; flex-direction: column; overflow: hidden;
    transition: transform .55s cubic-bezier(.4,0,.2,1), width .55s cubic-bezier(.4,0,.2,1), height .55s cubic-bezier(.4,0,.2,1), opacity .45s, box-shadow .55s;
    will-change: transform; }
  .rcard .rid { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; color: rgba(20,32,26,.45); }
  .rcard .nm { font-size: 12px; font-weight: 700; color: rgba(16,26,21,.88); margin-top: 8px; word-break: break-all; line-height: 1.3; }
  .rcard .meta { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: rgba(20,32,26,.55); margin-top: 6px; }
  .rcard .meta svg { flex-shrink: 0; }
  .rcard .note2 { font-size: 9px; line-height: 1.5; color: rgba(20,32,26,.5); margin-top: auto;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rcard .when2 { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: rgba(20,32,26,.4); margin-top: 5px; }
  .rcard .st { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
    font-family: 'JetBrains Mono', monospace; font-size: 8px; padding: 2.5px 7px; border-radius: 5px;
    background: rgba(20,32,26,.08); color: rgba(20,32,26,.6); margin-top: 8px; }
  .rcard .st i { width: 5px; height: 5px; border-radius: 99px; background: rgba(20,32,26,.35); }

  .rcard.focus { width: 178px; height: 206px; z-index: 5; transform: translate(-50%, -50%); border-radius: 15px; padding: 15px 16px;
    background: linear-gradient(155deg, hsl(var(--h),75%,62%), hsl(var(--h),85%,36%));
    box-shadow: 0 0 44px -6px hsla(var(--h),90%,45%,.55), 0 22px 44px -20px rgba(0,0,0,.95); }
  .rcard.focus .rid { font-size: 8.5px; color: rgba(255,255,255,.7); }
  .rcard.focus .nm { font-size: 14.5px; color: #fff; margin-top: 9px; }
  .rcard.focus .meta { font-size: 9.5px; color: rgba(255,255,255,.8); margin-top: 7px; }
  .rcard.focus .note2 { font-size: 10px; color: rgba(255,255,255,.72); }
  .rcard.focus .when2 { font-size: 8.5px; color: rgba(255,255,255,.55); }
  .rcard.focus .st { background: rgba(4,32,20,.28); color: #eafff5; font-size: 8.5px; }
  .rcard.focus .st i { background: #b8ffe0; box-shadow: 0 0 7px rgba(184,255,224,.9); }

  .rcard.l1, .rcard.r1 { width: 138px; height: 168px; z-index: 4; }
  .rcard.l1 { transform: translate(calc(-50% - 136px), -50%) rotateY(26deg) scale(.96); }
  .rcard.r1 { transform: translate(calc(-50% + 136px), -50%) rotateY(-26deg) scale(.96); }
  .rcard.l2, .rcard.r2 { width: 110px; height: 142px; z-index: 3; opacity: .88; }
  .rcard.l2 { transform: translate(calc(-50% - 238px), -50%) rotateY(34deg) scale(.9); }
  .rcard.r2 { transform: translate(calc(-50% + 238px), -50%) rotateY(-34deg) scale(.9); }
  .rcard.l2 .note2, .rcard.r2 .note2, .rcard.l2 .when2, .rcard.r2 .when2 { display: none; }
  .rcard.hidden2 { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.4); z-index: 1; }

  .hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(12,18,15,.75); border: 1px solid var(--line-2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 10.5px; color: rgba(232,239,235,.55); white-space: nowrap; }
  .hint b { color: var(--green-text); font-weight: 600; }

  .timeline { padding: 12px 15px 14px; border-top: 1px solid rgba(255,255,255,.055); }
  .timeline .row1 { display: flex; align-items: center; gap: 10px; }
  .timeline .row1 b { font-size: 12.5px; font-weight: 600; color: #e6eeea; }
  .tl-days { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(232,239,235,.4); }
  .tl-days .today { width: 19px; height: 19px; border-radius: 99px; display: flex; align-items: center; justify-content: center; background: var(--green); color: #04150d; font-weight: 700; }
  .tl-days .dim { color: rgba(232,239,235,.22); }
  .timeline .bar { margin-top: 10px; height: 4px; }
  .timeline .bar i { background: linear-gradient(90deg, hsla(var(--h),90%,41%,.25), var(--green)); }

  .detail { padding: 16px; }
  .detail .dhd { display: flex; align-items: center; gap: 8px; padding-bottom: 13px; border-bottom: 1px solid rgba(255,255,255,.055); font-size: 14px; font-weight: 700; color: var(--fg-strong); }
  .dcode { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; color: rgba(232,239,235,.38); margin-top: 14px; }
  .dname { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .dname b { font-size: 17px; font-weight: 700; color: var(--fg-strong); }
  .dbadge { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: hsla(var(--h),90%,41%,.13); color: var(--green-text); font-weight: 600; }
  .ddesc { font-size: 12px; line-height: 1.65; color: rgba(232,239,235,.58); margin-top: 9px; text-wrap: pretty; }
  .drow { display: flex; align-items: center; margin-top: 12px; font-size: 12px; }
  .drow .k { width: 74px; color: var(--fg-3); flex-shrink: 0; }
  .drow .v { color: #e6eeea; font-size: 12.5px; }
  .sdot { display: inline-block; width: 6px; height: 6px; border-radius: 99px; margin-right: 7px; vertical-align: 1px; }
  .advice { margin-top: 18px; padding: 14px; border-radius: 13px; background: var(--card); border: 1px solid rgba(255,255,255,.055); }
  .advice b { font-size: 12.5px; font-weight: 700; color: #eef4f0; }
  .advice .li { display: flex; gap: 8px; font-size: 11.5px; line-height: 1.55; color: rgba(232,239,235,.6); margin-top: 8px; }
  .advice .li::before { content: "·"; color: var(--green-hi); }
  .dbtns { display: flex; gap: 9px; margin-top: auto; padding-top: 16px; }
  .dbtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px; border-radius: 999px; font-size: 12.5px; cursor: pointer; }
  .dbtn.ghost { background: #151c19; color: rgba(232,239,235,.75); }
  .dbtn.ghost:hover { background: var(--active); color: var(--fg); }
  .dbtn.solid { background: var(--green-deep); border: 1px solid hsla(var(--h),90%,41%,.34); font-weight: 600; color: #f2fbf6; }
  .dbtn.solid:hover { background: var(--green-deep-hover); }

  /* ======== 项目索引视图 ======== */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .pcard { padding: 17px; border-radius: 15px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .pcard .r1 { display: flex; align-items: center; gap: 8px; }
  .pcard .r1 b { font-size: 14px; font-weight: 600; color: var(--fg-strong); word-break: break-all; margin-right: auto; }
  .pdot { width: 7px; height: 7px; border-radius: 99px; flex-shrink: 0; }
  .pstat { margin-left: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 7px; border-radius: 6px; flex-shrink: 0; }
  .pcard .meta { display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(232,239,235,.5); }
  .pcard .note { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--fg-4); }

  /* ======== 设置视图 ======== */
  .setwrap { max-width: 640px; display: flex; flex-direction: column; gap: 14px; }
  .setcard { padding: 18px; border-radius: 15px; background: var(--panel); border: 1px solid var(--line); }
  .setcard > b { font-size: 14px; font-weight: 700; color: var(--fg-strong); }
  .setcard .note { font-size: 12px; line-height: 1.7; color: var(--fg-2); margin-top: 8px; text-wrap: pretty; }
  .swatches { display: flex; gap: 10px; margin-top: 13px; }
  .sw { width: 34px; height: 34px; border-radius: 999px; cursor: pointer; border: 2px solid transparent; }
  .sw.on { border-color: rgba(255,255,255,.85); }
  input[type=range] { width: 100%; margin-top: 13px; accent-color: var(--green); }
  .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.85; color: rgba(214,235,225,.75); background: var(--card); border: 1px solid var(--line-3); border-radius: 10px; padding: 12px 14px; margin-top: 11px; overflow-x: auto; white-space: pre; }

  .live-tag { display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 6px; }
  .live-tag.on  { background: hsla(var(--h),90%,41%,.13); color: var(--green-text); }
  .live-tag.off { background: rgba(255,180,87,.12); color: var(--amber); }

  /* ======== 流体材质面板 ======== */
  .mpanel { position: fixed; right: -340px; top: 16px; bottom: 16px; width: 312px; z-index: 60;
    border-radius: 18px; background: linear-gradient(168deg, rgba(22,30,26,.94), rgba(8,12,10,.96));
    border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(40px) saturate(160%); -webkit-backdrop-filter: blur(40px) saturate(160%);
    box-shadow: -34px 0 90px -40px rgba(0,0,0,.95); padding: 20px 18px 16px; overflow-y: auto;
    transition: right .35s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; gap: 18px; }
  .mpanel.open { right: 16px; }
  .mpanel .mhd { display: flex; align-items: flex-start; justify-content: space-between; }
  .mpanel .mhd .t1 { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .18em; color: var(--green-text); text-transform: uppercase; }
  .mpanel .mhd .t2 { font-size: 16px; font-weight: 700; color: var(--fg-strong); margin-top: 7px; }
  .mclose { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--fg-3); }
  .mclose:hover { background: rgba(255,255,255,.06); color: var(--fg); }
  .msec .lbl { font-size: 11px; color: var(--fg-3); margin-bottom: 10px; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .preset { cursor: pointer; text-align: center; }
  .preset .pv { height: 44px; border-radius: 10px; border: 2px solid transparent; }
  .preset.on .pv { border-color: rgba(255,255,255,.85); }
  .preset .pn { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--fg-3); margin-top: 6px; }
  .ccolors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ccolor .cl { font-size: 10.5px; color: var(--fg-3); margin-bottom: 7px; }
  .ccolor input[type=color] { width: 100%; height: 34px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; background: none; padding: 2px; cursor: pointer; }
  .ccolor .hx { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--fg-4); margin-top: 5px; }
  .mslider { margin-top: 4px; }
  .mslider .sl { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--fg-2); }
  .mslider .sl .mono { font-size: 10px; color: var(--green-text); }
  .mslider input[type=range] { width: 100%; margin-top: 7px; accent-color: var(--green); }
  .mbtns { display: flex; gap: 9px; margin-top: auto; padding-top: 6px; }
  .mbtns .dbtn { padding: 10px; font-size: 12px; }
  .mdiv { height: 1px; background: rgba(255,255,255,.07); }

  /* ======== 横幅 / 出口 / 热力条 ======== */
  .banner { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 12px; font-size: 12.5px; }
  .banner.amber { background: rgba(255,180,87,.1); border: 1px solid rgba(255,180,87,.25); color: #ffcf94; }
  .banner.intro { background: hsla(var(--h),90%,41%,.08); border: 1px solid hsla(var(--h),90%,41%,.22); color: var(--fg-2); }
  .banner .bact { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  .banner .bbtn { padding: 6px 13px; border-radius: 999px; font-size: 11.5px; cursor: pointer; background: rgba(255,255,255,.07); color: var(--fg); white-space: nowrap; }
  .banner .bbtn:hover { background: rgba(255,255,255,.12); }
  .banner .bx { cursor: pointer; color: var(--fg-4); padding: 4px; }
  .jump { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; color: var(--fg-4); flex-shrink: 0; cursor: pointer; }
  .jump:hover { background: rgba(255,255,255,.08); color: var(--green-text); }
  .localtag { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,.06); color: var(--fg-4); flex-shrink: 0; }
  .heat { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin-top: 10px; }
  .heat i { flex: 1; min-width: 0; border-radius: 2.5px; background: rgba(255,255,255,.08); position: relative; }
  .heat i.hit { background: hsla(var(--h),85%,45%,.75); }
  .heat i.today { outline: 1.4px solid hsl(var(--h),90%,55%); outline-offset: 1px; }
  .heat-lbl { display: flex; justify-content: space-between; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--fg-4); }
  .rcard.focus .openbtn { display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 9px; padding: 7px 0; border-radius: 999px; background: rgba(4,32,20,.32);
    color: #eafff5; font-size: 10px; font-weight: 600; }
  .rcard:not(.focus) .openbtn { display: none; }
  .pcard .pgo { margin-left: auto; display: flex; align-items: center; gap: 5px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--fg-4); flex-shrink: 0; }
  .pcard.linked:hover .pgo { color: var(--green-text); }
  .pcard.linked { cursor: pointer; }
  .pcard.linked:hover { border-color: hsla(var(--h),90%,41%,.3); }
  body.calm .fluid i { animation: none !important; }
  body.calm .dot, body.calm .qdot { box-shadow: none !important; }
  .archbtn { display: none; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; color: var(--fg-4); flex-shrink: 0; cursor: pointer; }
  .qrow:hover .archbtn { display: flex; }
  .archbtn:hover { background: rgba(255,255,255,.08); color: var(--amber); }
  .restore { cursor: pointer; color: var(--fg-4); }
  .restore:hover { color: var(--green-text); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 80; padding: 10px 18px; border-radius: 999px; background: rgba(16,24,20,.95); border: 1px solid hsla(var(--h),90%,41%,.3); color: var(--fg); font-size: 12.5px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 1180px) { .grid { grid-template-columns: 240px minmax(0,1fr); } .panel.dpanel { display: none; } }
  @media (max-width: 920px)  { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } .grid { grid-template-columns: minmax(0,1fr); } .panel.qpanel { display: none; } .rail { display: none; } .search { margin-left: 0; } body { overflow: auto; } .app { height: auto; } }
</style>
</head>
<body>
<div class="mpanel" id="mpanel"></div>
<div class="toast" id="toast"></div>
<div class="app">
  <div class="rail">
    <div class="brand" id="brand"></div>
    <div class="nav" id="nav"></div>
    <div class="quota" id="quota"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<script>
(function () {
  /* ---- 数据合并：live 覆盖示意 ---- */
  var W = window.WORKBENCH;
  var LIVE = window.WORKBENCH_LIVE || null;
  if (LIVE) {
    ["stats", "queue", "projects", "ring", "ringFocus", "detail"].forEach(function (k) {
      if (LIVE[k] != null) W[k] = LIVE[k];
    });
  }
  var h = parseInt(localStorage.getItem("gg-accent") || W.accentH, 10);
  document.documentElement.style.setProperty("--h", h);
  document.title = "绿透 · " + W.title;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  ["dailyCommits", "generatedEpoch", "vaultName", "refreshCmd", "customSections"].forEach(function (k) {
    if (LIVE && LIVE[k] != null) W[k] = LIVE[k];
  });

  /* ---- 出口系统 ---- */
  var OPENERS = { warp: "Warp 终端", vscode: "VS Code", cursor: "Cursor" };
  var opener = localStorage.getItem("gg-opener") || "warp";
  var calm = localStorage.getItem("gg-calm") === "1";
  if (calm) document.body.classList.add("calm");
  var archived = {};
  try { archived = JSON.parse(localStorage.getItem("gg-archived") || "{}"); } catch (e) {}
  function repoUrl(path) {
    if (!path) return "";
    if (opener === "vscode") return "vscode://file" + path;
    if (opener === "cursor") return "cursor://file" + path;
    return "warp://action/new_tab?path=" + encodeURIComponent(path);
  }
  function openRepo(path) { if (path) location.href = repoUrl(path); }
  function obsUrl(file) {
    if (!file || !W.vaultName) return "";
    return "obsidian://open?vault=" + encodeURIComponent(W.vaultName) + "&file=" + encodeURIComponent(file.replace(/\.md$/, ""));
  }
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function copyRefreshCmd() {
    var cmd = W.refreshCmd || "python3 collect.py --projects ~/projects --vault ~/你的vault --out 页面所在目录";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(function () { toast("刷新命令已复制，去终端跑一下"); },
        function () { toast(cmd); });
    } else { toast(cmd); }
  }

  /* ---- 数据保鲜 ---- */
  function dataAgeHours() {
    if (!LIVE || !W.generatedEpoch) return 0;
    return (Date.now() / 1000 - W.generatedEpoch) / 3600;
  }
  function bannersHTML() {
    var out = "";
    var age = dataAgeHours();
    if (age > 12) {
      out += '<div class="banner amber"><span>数据已 ' + Math.floor(age) + ' 小时未刷新，下面的数字可能过期了</span>' +
        '<span class="bact"><span class="bbtn" data-act="copycmd">复制刷新命令</span></span></div>';
    }
    if (!LIVE && !localStorage.getItem("gg-intro-off")) {
      out += '<div class="banner intro"><span>正在看示意数据。一条命令即可接入你自己的 git 仓库和 Obsidian 待办</span>' +
        '<span class="bact"><span class="bbtn" data-act="gosettings">怎么接入</span><span class="bx" data-act="introoff">✕</span></span></div>';
    }
    return out;
  }
  setInterval(function () {
    if (!LIVE) return;
    var sc = document.createElement("script");
    sc.src = "./workbench-data.js?" + Date.now();
    sc.onload = function () {
      if (window.WORKBENCH_LIVE && window.WORKBENCH_LIVE.generatedEpoch &&
          window.WORKBENCH_LIVE.generatedEpoch > (LIVE.generatedEpoch || 0)) location.reload();
      sc.remove();
    };
    sc.onerror = function () { sc.remove(); };
    document.head.appendChild(sc);
  }, 300000);

  var MESH = [
    [[0,1,.31],[16,.8,.22],[-22,.9,.27]],
    [[-10,.95,.27],[12,1,.33],[-34,.75,.20]],
    [[-58,.9,.30],[-92,.95,.26],[-24,.85,.22]],
    [[-104,.95,.29],[-122,1,.25],[-80,.9,.23]]
  ];

  /* ---- 流体材质系统（对应参考视频的调色面板） ---- */
  var MAT_PRESETS = {
    original: { name: "Original", A: "#0ac98c", B: "#2bd46a", C: "#0a3f2e" },
    cyan:     { name: "Cyan",     A: "#00c8e0", B: "#0a86ff", C: "#083344" },
    klein:    { name: "Klein",    A: "#2f5cff", B: "#8a3ff2", C: "#0a1440" },
    chrome:   { name: "Chrome",   A: "#e8eef0", B: "#9ca8ad", C: "#14181a" }
  };
  var MAT_DEFAULT = { preset: "original", A: "#0ac98c", B: "#2bd46a", C: "#0a3f2e",
                      opacity: 88, speed: 100, strength: 100, mouse: 60 };
  var MAT = (function () {
    try { return Object.assign({}, MAT_DEFAULT, JSON.parse(localStorage.getItem("gg-material") || "{}")); }
    catch (e) { return Object.assign({}, MAT_DEFAULT); }
  })();
  function saveMat() { localStorage.setItem("gg-material", JSON.stringify(MAT)); }
  function hexToHsl(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return { h: 161, s: 90, l: 41 };
    var n = parseInt(m[1], 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, hh = 0, ss = 0, ll = (mx + mn) / 2;
    if (d) {
      ss = ll > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      hh *= 60;
    }
    return { h: hh, s: ss * 100, l: ll * 100 };
  }
  var BLOBS = [
    ["left:2%;top:16%;width:48%;height:56%","left:48%;top:-4%;width:44%;height:62%","left:26%;top:48%;width:52%;height:52%"],
    ["left:8%;top:8%;width:46%;height:58%","left:44%;top:22%;width:50%;height:56%","left:-2%;top:46%;width:54%;height:50%"],
    ["left:4%;top:20%;width:50%;height:54%","left:46%;top:0%;width:46%;height:60%","left:28%;top:46%;width:50%;height:52%"],
    ["left:6%;top:12%;width:48%;height:58%","left:46%;top:26%;width:46%;height:54%","left:24%;top:50%;width:52%;height:50%"]
  ];
  function meshColor(spec, j) {
    var base = hexToHsl(MAT["ABC"[j]]);
    var hh = ((base.h + spec[0]) % 360 + 360) % 360;
    var ss = Math.max(4, Math.min(95, base.s * spec[1]));
    var ll = Math.max(8, Math.min(74, base.l * (spec[2] / 0.31)));
    return "hsla(" + hh.toFixed(0) + "," + ss.toFixed(0) + "%," + ll.toFixed(0) + "%,.95)";
  }
  var FLUID_DUR = [22, 27, 19];
  function statCard(s, i) {
    var spd = Math.max(MAT.speed, 10) / 100;
    var k = MAT.strength / 100;
    var blobs = BLOBS[i % 4].map(function (pos, j) {
      return '<i style="' + pos + ';background:' + meshColor(MESH[i % 4][j], j) +
        ';animation-duration:' + (FLUID_DUR[j] / spd).toFixed(1) + 's"></i>';
    }).join("");
    var flStyle = "opacity:" + (0.25 + 0.72 * MAT.opacity / 100).toFixed(2) + ";filter:blur(" + (30 * (0.6 + 0.7 * k)).toFixed(0) + "px)";
    return '<div class="fcard"><div class="fluid" style="' + flStyle + '">' + blobs + '</div><div class="shade"></div><div class="sheen"></div>' +
      '<div class="body"><div class="cap">' + esc(s.cap) + '</div><div class="name">' + esc(s.name) + '</div>' +
      '<div class="val"><b>' + esc(s.value) + '</b><span>' + esc(s.unit) + '</span></div>' +
      '<div class="note">' + esc(s.note) + ' <b class="tone-' + s.tone + '">' + esc(s.delta) + '</b></div></div></div>';
  }

  /* ---- 队列行（可勾选，仅本机记忆） ---- */
  var doneSet = {};
  try { doneSet = JSON.parse(localStorage.getItem("gg-done") || "{}"); } catch (e) {}
  function jumpIcon(file) {
    var u = obsUrl(file);
    if (!u) return "";
    return '<span class="jump" data-obs="' + esc(u) + '" title="在 Obsidian 打开源文件">' +
      '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg></span>';
  }
  function qrow(t) {
    var done = !!doneSet[t.text];
    return '<div class="qrow' + (done ? " done" : "") + '" data-t="' + esc(t.text) + '">' +
      '<span class="cb">' + (done ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#04150d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.6 4.6 4.6L19 7.2"/></svg>' : "") + '</span>' +
      '<span class="txt">' + esc(t.text) + '</span>' +
      (done ? '<span class="localtag" title="只记在本机浏览器，vault 源文件未改">仅本机</span>' : "") +
      (t.src ? '<span class="mono" style="color:var(--fg-4)">' + esc(t.src) + '</span>' : "") +
      jumpIcon(t.file) +
      '<span class="badge ' + (t.tone || "todo") + '">' + esc(t.badge || "待办") + '</span>' +
      '<span class="mono t">' + esc(t.time || "") + '</span></div>';
  }
  function brow(t) {
    return '<div class="qrow"><span class="txt">' + esc(t.text) + '</span>' +
      (t.src ? '<span class="mono days" style="color:var(--fg-4)">' + esc(t.src) + '</span>' : "") + jumpIcon(t.file) +
      '<span class="archbtn" data-arch="' + esc(t.text) + '" title="归档：从积压里拿掉，不动源文件"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="13" rx="2"/><path d="M3 7.5 5 3.5h14l2 4M10 12h4"/></svg></span>' +
      '<span class="mono"' + (t.src ? "" : ' class="days"') + '>积压 ' + t.days + ' 天</span></div>';
  }
  function activeBacklog() {
    return W.queue.backlog.filter(function (t) { return !archived[t.text]; });
  }
  function bindQueue(root) {
    root.querySelectorAll(".jump[data-obs]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); location.href = el.dataset.obs; });
    });
    root.querySelectorAll(".archbtn[data-arch]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        archived[el.dataset.arch] = Date.now();
        localStorage.setItem("gg-archived", JSON.stringify(archived));
        toast("已归档，源文件没动");
        render();
      });
    });
    root.querySelectorAll(".rowlink[data-url]").forEach(function (el) {
      el.addEventListener("click", function () { window.open(el.dataset.url, "_blank", "noopener"); });
    });
    root.querySelectorAll(".qrow[data-t]").forEach(function (el) {
      el.addEventListener("click", function () {
        var k = el.dataset.t;
        doneSet[k] = !doneSet[k];
        if (!doneSet[k]) delete doneSet[k];
        localStorage.setItem("gg-done", JSON.stringify(doneSet));
        render();
      });
    });
  }

  /* 自定义区块协议：data 文件里的 customSections = [{title, note?, rows:[{text, sub?, url?, time?, badge?, tone?}]}] */
  function customSectionHTML(sec, compact) {
    var rows = (sec.rows || []).slice(0, compact ? 5 : 30).map(function (r) {
      return '<div class="qrow' + (r.url ? " rowlink" : "") + '"' + (r.url ? ' data-url="' + esc(r.url) + '" title="' + esc(r.url) + '"' : "") + '>' +
        '<span class="txt">' + esc(r.text) + '</span>' +
        (r.sub ? '<span class="mono" style="color:var(--fg-4)">' + esc(r.sub) + '</span>' : "") +
        (r.badge ? '<span class="badge ' + (r.tone || "todo") + '">' + esc(r.badge) + '</span>' : "") +
        (r.time ? '<span class="mono t">' + esc(r.time) + '</span>' : "") + '</div>';
    }).join("");

      if (current === "projects") {
        var val = q.value.trim().toLowerCase();
        var keep = q.value;
        render(val);
        var q2 = document.getElementById("q");
        q2.value = keep; q2.focus(); q2.setSelectionRange(keep.length, keep.length);
      }
    });
    var hue = document.getElementById("hue");
    if (hue) {
      hue.addEventListener("input", function () {
        h = +hue.value;
        document.documentElement.style.setProperty("--h", h);
        document.getElementById("hval").textContent = h;
        localStorage.setItem("gg-accent", h);
      });
      main.querySelectorAll(".sw").forEach(function (sw) {
        sw.addEventListener("click", function () {
          h = +sw.dataset.h;
          document.documentElement.style.setProperty("--h", h);
          localStorage.setItem("gg-accent", h);
          render();
        });
      });
    }
  }

  /* ---- 材质面板 ---- */
  function presetPv(pr) {
    return "background:radial-gradient(70% 90% at 22% 25%," + pr.A + " 0%,transparent 62%)," +
           "radial-gradient(70% 90% at 78% 40%," + pr.B + " 0%,transparent 64%)," +
           "radial-gradient(90% 90% at 50% 95%," + pr.C + " 0%,transparent 72%),#080b0a";
  }
  function slider(id, label, val, min, max, unit) {
    return '<div class="mslider"><div class="sl"><span>' + label + '</span><span class="mono" id="' + id + 'v">' + val + unit + '</span></div>' +
      '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" value="' + val + '"></div>';
  }
  function buildPanel() {
    var el = document.getElementById("mpanel");
    el.innerHTML =
      '<div class="mhd"><div><div class="t1">Glass Material</div><div class="t2">四张流体卡片设置</div></div>' +
      '<span class="mclose" id="mclose"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>' +
      '<div class="msec"><div class="lbl">配色预设</div><div class="presets">' +
        Object.keys(MAT_PRESETS).map(function (k) {
          var pr = MAT_PRESETS[k];
          return '<div class="preset' + (MAT.preset === k ? " on" : "") + '" data-p="' + k + '">' +
            '<div class="pv" style="' + presetPv(pr) + '"></div><div class="pn">' + pr.name + '</div></div>';
        }).join("") + '</div></div>' +
      '<div class="msec"><div class="lbl">自定义颜色</div><div class="ccolors">' +
        [["A", "主色 A"], ["B", "辅色 B"], ["C", "阴影 C"]].map(function (c) {
          return '<div class="ccolor"><div class="cl">' + c[1] + '</div>' +
            '<input type="color" id="mc' + c[0] + '" value="' + MAT[c[0]] + '">' +
            '<div class="hx" id="mch' + c[0] + '">' + MAT[c[0]] + '</div></div>';
        }).join("") + '</div></div>' +
      '<div class="mdiv"></div>' +
      '<div class="msec"><div class="lbl">卡片底材</div>' + slider("mop", "底色不透明度", MAT.opacity, 20, 100, "%") + '</div>' +
      '<div class="msec"><div class="lbl">动态参数</div>' +
        slider("mspd", "流动速度", MAT.speed, 25, 300, "%") +
        slider("mstr", "流体强度", MAT.strength, 30, 160, "%") +
        slider("mmou", "鼠标扰动", MAT.mouse, 0, 100, "%") + '</div>' +
      '<div class="mbtns"><div class="dbtn ghost" id="mreset">恢复默认</div><div class="dbtn solid" id="msave">保存设置</div></div>';

    el.querySelector("#mclose").addEventListener("click", function () { el.classList.remove("open"); });
    el.querySelectorAll(".preset").forEach(function (pe) {
      pe.addEventListener("click", function () {
        var pr = MAT_PRESETS[pe.dataset.p];
        MAT.preset = pe.dataset.p; MAT.A = pr.A; MAT.B = pr.B; MAT.C = pr.C;
        saveMat(); buildPanel(); el.classList.add("open"); applyMaterial();
      });
    });
    ["A", "B", "C"].forEach(function (c) {
      el.querySelector("#mc" + c).addEventListener("input", function (e) {
        MAT[c] = e.target.value; MAT.preset = "";
        el.querySelector("#mch" + c).textContent = e.target.value;
        el.querySelectorAll(".preset").forEach(function (x) { x.classList.remove("on"); });
        saveMat(); applyMaterial();
      });
    });
    [["mop", "opacity", "%"], ["mspd", "speed", "%"], ["mstr", "strength", "%"], ["mmou", "mouse", "%"]].forEach(function (cfg) {
      el.querySelector("#" + cfg[0]).addEventListener("input", function (e) {
        MAT[cfg[1]] = +e.target.value;
        el.querySelector("#" + cfg[0] + "v").textContent = e.target.value + cfg[2];
        saveMat(); applyMaterial();
      });
    });
    el.querySelector("#mreset").addEventListener("click", function () {
      MAT = Object.assign({}, MAT_DEFAULT); saveMat(); buildPanel(); el.classList.add("open"); applyMaterial();
    });
    el.querySelector("#msave").addEventListener("click", function () { saveMat(); el.classList.remove("open"); });
  }
  function applyMaterial() {
    var st = document.querySelector(".stats");
    if (st) { st.innerHTML = W.stats.map(statCard).join(""); bindMouse(st); }
  }
  function bindMouse(st) {
    st.querySelectorAll(".fcard").forEach(function (card) {
      var fl = card.querySelector(".fluid");
      card.addEventListener("mousemove", function (e) {
        if (!MAT.mouse) return;
        var r = card.getBoundingClientRect();
        var dx = ((e.clientX - r.left) / r.width - 0.5) * 2, dy = ((e.clientY - r.top) / r.height - 0.5) * 2;
        var amp = 26 * MAT.mouse / 100;
        fl.style.transform = "translate(" + (dx * amp).toFixed(1) + "px," + (dy * amp).toFixed(1) + "px)";
      });
      card.addEventListener("mouseleave", function () { fl.style.transform = ""; });
    });
  }
  function toggblePanel() {
    var el = document.getElementById("mpanel");
    el.classList.toggle("open");
  }

  document.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (act) {
      if (act.dataset.act === "copycmd") copyRefreshCmd();
      if (act.dataset.act === "gosettings") { current = "settings"; render(); }
      if (act.dataset.act === "introoff") { localStorage.setItem("gg-intro-off", "1"); render(); }
      if (act.dataset.act === "unarch") { archived = {}; localStorage.setItem("gg-archived", "{}"); render(); }
      if (act.dataset.act === "calm") {
        calm = !calm;
        localStorage.setItem("gg-calm", calm ? "1" : "0");
        document.body.classList.toggle("calm", calm);
        if (calm) { cruiseOn = false; stopCruise(); var sp2 = document.getElementById("spin"); if (sp2) sp2.classList.remove("on"); }
        render();
      }
      return;
    }
    var op = e.target.closest("[data-opener]");
    if (op) { opener = op.dataset.opener; localStorage.setItem("gg-opener", opener); render(); }
  });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (current !== "projects") { current = "projects"; render(); }
      var q = document.getElementById("q"); if (q) q.focus();
    }
  });

  buildPanel();
  render();
})();
</script>
</body>
</html>
